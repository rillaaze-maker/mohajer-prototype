<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مهاجر · نتیجه‌های تست</title>
<meta name="theme-color" content="#0B0D10">
<meta name="robots" content="noindex">
<link rel="icon" href="./icons/icon-192.png">
<!--
  ════════════════════════════════════════════════════════════════════════
  مهاجر · نتیجه‌های تست میدانی
  test-insights.html?v=4.5&r=2

  ترتیب صفحه، ترتیب تصمیم است:
    چند نفر  →  کجا گیر کردند  →  کدام سن  →  کجای مسیر ریزش شد
    →  روی کدام نقطه از کدام صفحه زدند  →  خودشان چه گفتند  →  تک‌تک جلسه‌ها

  Everything here is derived from the same event stream (TK.derive), so a
  number shown twice is the same number. Nothing is averaged across
  versions: a version filter is always applied, because comparing v3 and
  v4.5 in one bar would hide the only thing worth seeing.
  ════════════════════════════════════════════════════════════════════════
-->
<style>
@font-face{font-family:Dana;src:url('./fonts/Dana-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:Dana;src:url('./fonts/Dana-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Dana;src:url('./fonts/Dana-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Dana;src:url('./fonts/Dana-DemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Dana;src:url('./fonts/Dana-Bold.woff2') format('woff2');font-weight:700;font-display:swap}

:root{
  --f:Dana,system-ui,sans-serif;
  --gold:#D5A45C;--ok:#3FBF8F;--bad:#E06C5B;--blue:#4A9BE8;--purple:#8B6FD4;
  --w1:#fff;--w2:rgba(255,255,255,.7);--w3:rgba(255,255,255,.44);
  --surf:rgba(255,255,255,.05);--surf2:rgba(255,255,255,.08);--brd:rgba(255,255,255,.11);
  --spring:cubic-bezier(.16,1,.3,1);--swift:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--f);color:var(--w1);background:#0B0D10;line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 600px at 82% -10%,rgba(213,164,92,.12),transparent 62%),
             linear-gradient(168deg,#1A1F26,#0B0D10 56%,#12161B)}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:40px 22px 90px}
.num{unicode-bidi:isolate;font-variant-numeric:tabular-nums}   /* Persian digits in Persian text: no LTR override */
.en{direction:ltr;unicode-bidi:isolate}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.brand .mk{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);display:grid;place-items:center}
.brand .nm{font-size:16px;font-weight:600;letter-spacing:-.02em}
.brand a{color:var(--w3);font-size:12px;text-decoration:none}
.brand a:hover{color:var(--gold)}

h1{font-size:clamp(24px,4.6vw,33px);font-weight:700;letter-spacing:-.035em;line-height:1.22}
.lead{font-size:14px;color:var(--w2);margin-top:10px;max-width:60ch}
.sec{display:flex;align-items:baseline;gap:10px;margin:44px 0 14px}
.sec h2{font-size:16.5px;font-weight:600;letter-spacing:-.025em}
.sec .h{font-size:11.5px;color:var(--w3)}
.sec .ln{flex:1;height:1px;background:var(--brd)}
.tiny{font-size:11.5px;color:var(--w3);line-height:1.8}
.card{background:var(--surf);border:1px solid var(--brd);border-radius:18px;padding:20px}
.card+.card{margin-top:10px}

/* ── filters ────────────────────────────────────────────────────── */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surf);
  border:1px solid var(--brd);border-radius:16px;padding:12px 14px;position:sticky;top:0;z-index:5;
  backdrop-filter:blur(12px);background:rgba(16,19,23,.86)}
.filters .lb{font-size:11px;color:var(--w3);margin-inline-end:2px}
select,input[type=text]{background:var(--surf2);border:1px solid var(--brd);border-radius:99px;
  padding:9px 14px;color:var(--w1);font:500 12.5px var(--f);outline:none;appearance:none;cursor:pointer}
select:focus{border-color:var(--gold)}
option{background:#14181D}
.chip{border:1px solid var(--brd);background:var(--surf);color:var(--w2);border-radius:99px;
  font:500 12px/1 var(--f);padding:9px 12px;cursor:pointer;transition:.2s var(--swift);white-space:nowrap}
.chip[aria-pressed=true]{background:rgba(213,164,92,.16);border-color:var(--gold);color:var(--w1)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--brd);background:var(--surf2);
  color:var(--w1);border-radius:99px;font:600 12.5px/1 var(--f);padding:10px 15px;cursor:pointer;
  transition:.2s var(--swift);text-decoration:none}
.btn:hover{border-color:rgba(213,164,92,.45)}
.btn.p{background:var(--gold);border-color:var(--gold);color:#0B0D10}

.tabs{display:flex;gap:6px;margin-top:18px;background:var(--surf);border:1px solid var(--brd);
  border-radius:99px;padding:5px;width:fit-content}
.tb{border:none;background:none;color:var(--w2);font:600 13px/1 var(--f);padding:10px 18px;
  border-radius:99px;cursor:pointer;transition:.2s var(--swift)}
.tb[aria-pressed=true]{background:var(--gold);color:#0B0D10}

/* ── hypothesis cards ───────────────────────────────────────────── */
.hcard{background:var(--surf);border:1px solid var(--brd);border-radius:18px;padding:20px;margin-top:10px}
.hcard .hh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.hcard .hh h3{font-size:15.5px;font-weight:600;letter-spacing:-.02em}
.hcard .hh .code{font-size:10.5px;font-weight:700;color:var(--w3);letter-spacing:.08em}
.hcard .hl{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:6px 0 2px}
.hcard .hs{font-size:12px;color:var(--w3);margin-bottom:14px}
.kpirow{display:grid;grid-template-columns:1fr 62px 54px 46px 58px;gap:8px;align-items:center;
  padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px}
.kpirow .n{color:var(--w2)}
.kpirow .v{font-weight:700;text-align:end}
.kpirow .g{color:var(--w3);text-align:end;font-size:11.5px}
.kpirow .st{text-align:end;font-size:10.5px;font-weight:700}
.kpirow .st.ok{color:var(--ok)} .kpirow .st.near{color:var(--gold)} .kpirow .st.bad{color:var(--bad)}
.kpirow .st.none{color:var(--w3)}
.kpirow .nn{color:var(--w3);text-align:end;font-size:11px}
.kpirow.diag{opacity:.78}
.kpirow.diag .n:after{content:'تشخیصی';font-size:9px;color:var(--w3);margin-inline-start:6px;
  border:1px solid var(--brd);border-radius:5px;padding:1px 4px;vertical-align:middle}
.src{display:inline-block;font-size:9.5px;font-weight:700;border-radius:5px;padding:2px 5px;
  margin-inline-start:6px;vertical-align:middle;white-space:nowrap}
.src.b{background:rgba(74,155,232,.16);color:#4A9BE8}
.src.a{background:rgba(139,111,212,.16);color:#8B6FD4}
.src.c{background:rgba(63,191,143,.16);color:var(--ok)}
/* نوار کیفیت داده: چند نفر، تا کجا — بالای هر دو tab */
.dq{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.dq span{display:inline-flex;align-items:baseline;gap:6px;background:var(--surf);border:1px solid var(--brd);
  border-radius:99px;padding:7px 12px;font-size:11.5px;color:var(--w3)}
.dq span b{color:var(--w1);font-weight:700;font-size:13px}
.dq span.warn{border-color:rgba(224,108,91,.45);color:var(--bad)}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:10px}
.sv .c{background:var(--surf);border:1px solid var(--brd);border-radius:15px;padding:15px}
.sv .c .v{font-size:24px;font-weight:700;letter-spacing:-.03em}
.sv .c .l{font-size:11.5px;color:var(--w2);margin-top:4px;line-height:1.6}
.sv .c .m{font-size:10.5px;color:var(--w3);margin-top:7px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sv .c.ok{border-color:rgba(63,191,143,.4)} .sv .c.bad{border-color:rgba(224,108,91,.4)}
.sv .c.near{border-color:rgba(213,164,92,.4)}
.hstat{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:6px 13px;
  font-size:11.5px;font-weight:700;margin-top:14px}
.hstat.ok{background:rgba(63,191,143,.15);color:var(--ok)}
.hstat.near{background:rgba(213,164,92,.16);color:var(--gold)}
.hstat.bad{background:rgba(224,108,91,.16);color:var(--bad)}
.hstat.none{background:var(--surf2);color:var(--w3)}
.dist{margin-top:14px}
.dist .d{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.dist .d .b{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.dist .d .b i{display:block;height:100%;background:var(--gold);border-radius:99px}
.dist .d .l{color:var(--w2)}
.dist .d .l small{display:block;color:var(--w3);font-size:10.5px;margin-top:1px}
.dist .d .p{text-align:end;color:var(--w2);font-weight:600}
.qual{display:flex;gap:11px;align-items:flex-start;border-radius:14px;padding:13px 15px;margin-top:16px;
  border:1px solid rgba(213,164,92,.22);background:rgba(213,164,92,.07)}
.qual p{font-size:12.5px;color:var(--w2);line-height:1.8}
.qual b{color:#fff}

/* ── kpis ───────────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surf);border:1px solid var(--brd);border-radius:16px;padding:16px 17px}
.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.kpi .l{font-size:11.5px;color:var(--w3);margin-top:2px}
.kpi .s{font-size:10.5px;color:var(--w3);margin-top:6px}
.kpi.gold .v{color:var(--gold)} .kpi.ok .v{color:var(--ok)} .kpi.bad .v{color:var(--bad)}

/* ── bars ───────────────────────────────────────────────────────── */
.lay{display:flex;flex-direction:column;gap:11px;margin-top:6px}
.lay .r{display:grid;grid-template-columns:96px 1fr 46px;gap:12px;align-items:center}
.lay .nm{font-size:13px;font-weight:500}
.lay .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.lay .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s var(--spring)}
.lay .pc{font-size:12.5px;color:var(--w2);text-align:end}
.verdict{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1px solid var(--brd)}
.verdict .big{font-size:15px;font-weight:600}
.verdict p{font-size:12.5px;color:var(--w2);margin-top:4px;line-height:1.8}

.stack{display:flex;height:11px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.06)}
.stack i{display:block;height:100%}
.keys{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--w3)}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys b{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ── age ────────────────────────────────────────────────────────── */
.ages{display:flex;flex-direction:column;gap:14px}
.age{display:grid;grid-template-columns:78px 1fr;gap:13px;align-items:center}
.age .b{font-size:12.5px;font-weight:600}
.age .b small{display:block;font-size:10.5px;font-weight:400;color:var(--w3)}
.age .m{display:flex;gap:16px;margin-top:7px;font-size:11px;color:var(--w3);flex-wrap:wrap}
.age .m b{color:var(--w2);font-weight:600}

/* ── funnel ─────────────────────────────────────────────────────── */
.fun{display:flex;flex-direction:column;gap:3px}
.fun .s{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
  background:rgba(255,255,255,.03);border-radius:10px;padding:9px 13px;position:relative;overflow:hidden}
.fun .s .fill{position:absolute;inset:0;inset-inline-end:auto;background:rgba(213,164,92,.14);
  border-inline-end:2px solid rgba(213,164,92,.5);transition:width .9s var(--spring)}
.fun .s .nm{position:relative;font-size:13px;font-weight:500}
.fun .s .nm small{color:var(--w3);font-weight:400;font-size:11px;margin-inline-start:7px}
.fun .s .n{position:relative;font-size:12.5px;color:var(--w2)}
.fun .drop{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--bad);padding:2px 13px}
.fun .drop.ok{color:var(--w3)}

/* ── heat ───────────────────────────────────────────────────────── */
.heat{display:flex;gap:22px;flex-wrap:wrap}
.heat .side{flex:1;min-width:230px}
.dev{position:relative;width:390px;height:844px;flex:none;border-radius:34px;overflow:hidden;
  background:#0E1216;box-shadow:0 0 0 8px #101317,0 0 0 9.5px #303740,0 30px 70px -34px rgba(0,0,0,.8)}
.dev iframe{width:390px;height:844px;border:0;display:block}
.dev canvas{position:absolute;inset:0;pointer-events:none}
.dev .mk{position:absolute;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%}
.dev .mk.rage{width:26px;height:26px;border:2px solid var(--bad);box-shadow:0 0 0 4px rgba(224,108,91,.2)}
.dev .mk.dead{width:14px;height:14px;border:1.5px dashed rgba(255,255,255,.65)}
.screens{display:flex;flex-direction:column;gap:5px;max-height:760px;overflow:auto;padding-inline-end:4px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;background:rgba(255,255,255,.03);
  border:1px solid transparent;border-radius:11px;padding:9px 12px;cursor:pointer;transition:.18s var(--swift);
  font-family:var(--f);color:var(--w1);text-align:start}
.srow:hover{background:rgba(255,255,255,.06)}
.srow[aria-pressed=true]{border-color:var(--gold);background:rgba(213,164,92,.1)}
.srow .n{font-size:13px;font-weight:500}
.srow .n small{display:block;font-size:10px;color:var(--w3)}
.srow .v{font-size:11.5px;color:var(--w2)}
.srow .w{font-size:10.5px;color:var(--bad)}

/* ── quotes ─────────────────────────────────────────────────────── */
.quotes{columns:2;column-gap:10px}
@media(max-width:760px){.quotes{columns:1}}
.q{break-inside:avoid;background:var(--surf);border:1px solid var(--brd);border-radius:15px;
  padding:15px 16px;margin-bottom:10px}
.q .hd{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.q .hd .t{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.03em}
.q .hd .age{font-size:10.5px;color:var(--w3)}
.q p{font-size:13.5px;line-height:1.85;color:var(--w1)}
.q .src{font-size:10.5px;color:var(--w3);margin-top:8px}

/* ── sessions ───────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:10px 8px;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
th{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--w3)}
tr.s-row{cursor:pointer}
tr.s-row:hover td{background:rgba(255,255,255,.03)}
.pill{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--w3)}
.pill.g{background:rgba(63,191,143,.15);color:var(--ok)}
.pill.y{background:rgba(213,164,92,.17);color:var(--gold)}
.pill.r{background:rgba(224,108,91,.16);color:var(--bad)}
.track{display:flex;gap:4px;flex-wrap:wrap;padding:12px 8px 18px}
.track .st{display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.04);border-radius:9px;
  padding:7px 10px;min-width:74px}
.track .st b{font-size:11.5px;font-weight:600}
.track .st span{font-size:10px;color:var(--w3)}
.track .st.hot{background:rgba(224,108,91,.13)}
.track .arw{align-self:center;color:var(--w3);font-size:11px}

.empty{text-align:center;padding:46px 20px;color:var(--w3)}
.empty h3{font-size:16px;color:var(--w2);font-weight:600;margin-bottom:6px}
footer{margin-top:54px;padding-top:20px;border-top:1px solid var(--brd);font-size:11.5px;color:var(--w3)}

/* ── phone: the same page, one column ── */
@media(max-width:860px){
  .wrap{padding:26px 15px 70px}
  .heat{flex-direction:column-reverse;gap:16px}
  .dev{width:100%;max-width:390px;height:auto;aspect-ratio:390/844;margin:0 auto}
  .dev iframe{width:100%;height:100%}
  .screens{max-height:290px}
  .filters{position:static;padding:11px}
  .age{grid-template-columns:66px 1fr;gap:10px}
  .lay .r{grid-template-columns:78px 1fr 40px;gap:9px}
  .kpirow{grid-template-columns:1fr repeat(4,auto);gap:5px;font-size:11px}
  .kpirow .g,.kpirow .nn{font-size:10px}
  table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="mk"><svg viewBox="0 0 49.33 39.99" width="16" height="16" fill="#D5A45C"><path d="M30.28,39.83q1.83-7.89,3.66-15.77c.1-.47.52-1.07.13-1.43s-1,.12-1.51.27c-6.83,2.13-13.88,2.55-21,2.57A91.81,91.81,0,0,1,0,24.81,142.7,142.7,0,0,0,14.58,21C23,18.22,31,14.81,38.23,9.62a15.5,15.5,0,0,0,5.1-5.48,7.72,7.72,0,0,1,6-4.14L30.63,40Z"/></svg></div>
    <div class="nm">مهاجر · نتیجه‌های تست</div>
    <a href="./test.html">کنسول</a><a href="./index.html">داشبورد</a>
  </div>

  <h1 id="title">—</h1>
  <p class="lead" id="sub">در حال خواندن…</p>

  <div class="filters" style="margin-top:20px">
    <span class="lb">نسخه</span><select id="f-ver" onchange="touch();apply()"></select>
    <span class="lb">راند</span><select id="f-round" onchange="touch();apply()"></select>
    <span class="lb">پروتکل</span><select id="f-proto" onchange="touch();apply()"></select>
    <span class="lb">وضعیت</span><select id="f-state" onchange="touch();apply()">
      <option value="">همه</option><option value="done">کامل</option><option value="part">ناتمام</option>
    </select>
    <span class="lb">سن</span><span id="f-ages" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    <span style="flex:1"></span>
    <button class="btn" onclick="load()">تازه‌سازی</button>
    <button class="btn" onclick="exportCsv()">CSV جلسه‌ها</button>
    <button class="btn" onclick="exportContacts()">CSV تماس‌ها</button>
    <button class="btn" onclick="exportJson()">JSON</button>
  </div>

  <div class="tabs" id="tabs">
    <button class="tb" aria-pressed="true" onclick="setView('ux')">کاربردپذیری</button>
    <button class="tb" aria-pressed="false" onclick="setView('hypo')">فرضیه‌ها</button>
  </div>
  <div id="body"></div>

  <footer>هر عدد این صفحه از همان جریان رویدادها ساخته می‌شود؛ چیزی دوباره‌شماری یا تخمین نمی‌شود. زیر سه جلسه، این صفحه قضاوت نمی‌کند — فقط داده را نشان می‌دهد.</footer>
</div>

<script src="./test-kit.js?v=20261009b"></script>
<script>
const $ = TK.$, esc = TK.esc, fa = TK.fa;
let CFG = {}, VERS = [], ALL = [], SEL = [], SRC = null, ageFilter = new Set(), heatScreen = null;
let MIXED = false;
/* راند و پروتکلِ داخل آدرس فقط تا وقتی حاکم‌اند که خودِ آدم چیزی را عوض
   نکرده باشد؛ بعد از آن، هر تازه‌سازی نباید انتخابش را پس بگیرد. */
let TOUCHED = false;
function touch(){ TOUCHED = true; }

(async function boot(){
  CFG = await TK.config();
  VERS = await TK.versions();
  $('f-ages').innerHTML = TK.AGES.map(a =>
    '<button class="chip" aria-pressed="false" data-a="' + a + '" onclick="toggleAge(this)">' + a + '</button>').join('');
  await load();
})();

/* ── data ───────────────────────────────────────────────────────── */
/* دو مرحله: اول هرچه بدون شبکه داریم، بعد تازه‌سازی از سرور. هیچ‌وقت
   صفحهٔ خالی به‌خاطر کندیِ سرور. */
async function load(){
  TK.warm(CFG);                                   /* همین‌جا، بی‌انتظار */
  const quick = await TK.readAll(CFG, { full: 1 }, { localOnly: true });
  ingest(quick, 'local');
  if (!TK.eps(CFG).length) return;
  $('sub-src').textContent = 'در حال تازه‌سازی از سرور…';
  const fresh = await TK.readAll(CFG, { full: 1 });
  ingest(fresh, 'live');
}
function ingest(got, how){
  ALL = got.sessions.filter(s => s && s.ev);            /* خلاصه‌ها تحلیل نمی‌شوند */
  /* امتیاز دوباره از قاعده‌های نسخهٔ جاری حساب می‌شود، نه از آنچه runner
     ذخیره کرده: اگر قاعده‌ای عوض شود، جلسه‌های قبلی هم با همان تعریف
     خوانده می‌شوند و دو عدد از یک داده بیرون نمی‌آید. */
  ALL.forEach(s => { if (!s._d) s._d = TK.derive(s);
    s._s = TK.scoreSession(s); s._b = TK.behaviorOf(s); });
  SRC = got; SRC.how = how;

  const vers = [...new Set(ALL.map(s => String(s.ver)))];
  /* یک تازه‌سازی نباید انتخاب کاربر را به نسخهٔ داخل آدرس برگرداند */
  const want = $('f-ver').value || TK.qs('v', '') || (VERS.find(v => v.status === 'current') || {}).id || vers[0] || '';
  $('f-ver').innerHTML = (vers.length ? vers : [want]).map(v =>
    '<option value="' + esc(v) + '"' + (v === want ? ' selected' : '') + '>' +
    esc((VERS.find(x => x.id === v) || {}).name || ('v' + v)) + '</option>').join('');
  apply();
}

function apply(){
  const v = $('f-ver').value;
  const rounds = [...new Set(ALL.filter(s => String(s.ver) === v).map(s => String(s.r)))].sort();
  const wantR = TOUCHED ? $('f-round').value : (TK.qs('r', '') || '');
  $('f-round').innerHTML = '<option value="">همه</option>' + rounds.map(r =>
    '<option value="' + esc(r) + '"' + (r === wantR ? ' selected' : '') + '>' + fa(r) + '</option>').join('');
  const r = $('f-round').value;

  /* پروتکل: تعریفِ چند شاخص بین ۱.۰ و ۱.۱ عوض شده، پس پیش‌فرض تازه‌ترین
     پروتکلِ موجود است و جمع‌کردنِ دو پروتکل باید انتخابِ صریحِ خودِ آدم باشد. */
  const protos = [...new Set(ALL.filter(s => String(s.ver) === v).map(TK.protoOf))].sort().reverse();
  const wantP = TOUCHED ? ($('f-proto').value || protos[0] || '')
                        : (TK.qs('p', '') || protos[0] || TK.PROTOCOL);
  $('f-proto').innerHTML = protos.map(p =>
    '<option value="' + esc(p) + '"' + (p === wantP ? ' selected' : '') + '>' + fa(p) + '</option>').join('') +
    '<option value="all"' + (wantP === 'all' ? ' selected' : '') + '>همه (مخلوط)</option>';
  const p = $('f-proto').value, st = $('f-state').value;

  SEL = ALL.filter(s => String(s.ver) === v
    && (!r || String(s.r) === r)
    && (p === 'all' || !p || TK.protoOf(s) === p)
    && (!st || (st === 'done' ? !!s.done : !s.done))
    && (!ageFilter.size || ageFilter.has((s.seg || {}).age)));
  MIXED = p === 'all' && protos.length > 1;

  const nm = (VERS.find(x => x.id === v) || {}).name || ('v' + v);
  $('title').textContent = nm;
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? 'همین حالا' : m < 60 ? fa(m) + ' دقیقه پیش' : fa(Math.round(m / 60)) + ' ساعت پیش'; };
  const src = !SRC ? '' :
    SRC.how === 'local'
      ? (SRC.cachedAt ? 'از نسخهٔ ذخیره‌شده · ' + ago(SRC.cachedAt) : 'فقط دادهٔ همین مرورگر')
      : (SRC.status.every(x => x.ok) ? 'به‌روز شد · همین حالا'
         : 'سرور جواب نداد؛ آخرین نسخهٔ ذخیره‌شده' + (SRC.cachedAt ? ' · ' + ago(SRC.cachedAt) : ''));
  $('sub').innerHTML = SEL.length
    ? fa(SEL.length) + ' جلسه' + (r ? ' · راند ' + fa(r) : ' · همهٔ راندها') +
      (ageFilter.size ? ' · فقط ' + [...ageFilter].join('، ') : '') +
      ' <span id="sub-src" style="color:var(--w3)">— ' + esc(src) + '</span>'
    : 'هنوز جلسه‌ای برای این فیلتر نیست. <span id="sub-src" style="color:var(--w3)">' + esc(src) + '</span>';
  render();
}
function toggleAge(b){
  const a = b.dataset.a, on = b.getAttribute('aria-pressed') === 'true';
  b.setAttribute('aria-pressed', !on);
  if (on) ageFilter.delete(a); else ageFilter.add(a);
  apply();
}

/* ── small maths ────────────────────────────────────────────────── */
const med = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); const h = s.length >> 1;
  return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const pct = (n, d) => d ? Math.round(n / d * 100) : 0;

/* ── render ─────────────────────────────────────────────────────── */
function render(){
  if (!SEL.length) {
    $('body').innerHTML = '<div class="card empty"><h3>هنوز داده‌ای نیست</h3>' +
      '<p class="tiny">لینک این نسخه را از کنسول بردارید و بفرستید؛ نتیجه‌ها همین‌جا ظاهر می‌شوند.<br>' +
      'اگر کسی «کد» فرستاده، از کنسول واردش کنید.</p></div>';
    return;
  }
  if (VIEW === 'hypo') { $('body').innerHTML = hypoView(); return; }
  $('body').innerHTML = dqBar() +
    blockCompare() + blockKpis() + blockFriction() + blockAges() + blockFunnel() + blockHeat() + blockStuck() +
    blockQuotes() + blockContacts() + blockSessions();
  paintHeat();
  bindSessions();
}

/* ── ۰ مقایسهٔ نسخه‌ها ────────────────────────────────────────────
   فقط وقتی معنا دارد که بیش از یک نسخه در میدان باشد. عمداً کوتاه است:
   اینجا فقط می‌گوید «کدام نسخه بهتر جواب داده»؛ چراییِ آن، بقیهٔ صفحه است. */
function blockCompare(){
  const ids = [...new Set(ALL.map(s => String(s.ver)))];
  if (ids.length < 2) return '';
  const row = (id) => {
    const g = ALL.filter(s => String(s.ver) === id);
    const dn = g.filter(s => s.done);
    const tr = g.map(s => +(s.end || {}).trust).filter(n => n > 0);
    const mi = g.filter(s => s._s.money_intent !== undefined);
    const cur = id === $('f-ver').value;
    return '<tr' + (cur ? ' style="background:rgba(213,164,92,.07)"' : '') + '>' +
      '<td><b>' + esc((VERS.find(x => x.id === id) || {}).name || ('v' + id)) + '</b>' +
        (cur ? ' <span class="pill y">در نمایش</span>' : '') + '</td>' +
      '<td class="num">' + fa(g.length) + '</td>' +
      '<td class="num">' + fa(pct(dn.length, g.length)) + '٪</td>' +
      '<td class="num">' + (tr.length ? fa(Math.round(med(tr) * 10) / 10) : '—') + '</td>' +
      '<td class="num">' + (mi.length ? fa(pct(mi.filter(x => x._s.money_intent).length, mi.length)) + '٪' : '—') + '</td>' +
      '<td class="num">' + (dn.length ? TK.mmss(med(dn.map(s => s._d.ms))) : '—') + '</td></tr>';
  };
  return '<div class="sec"><h2>نسخه‌ها کنار هم</h2><span class="h">همهٔ راندها</span><span class="ln"></span></div>' +
    '<div class="card"><table><tr><th>نسخه</th><th>شرکت‌کننده</th><th>تکمیل</th><th>اعتماد</th><th>قصد پول واقعی</th><th>زمان میانه</th></tr>' +
    ids.sort().reverse().map(row).join('') + '</table>' +
    '<p class="tiny" style="margin-top:12px">این جدول تنها جایی است که نسخه‌ها با هم جمع می‌شوند. بقیهٔ صفحه فقط نسخهٔ انتخاب‌شده را نشان می‌دهد.</p></div>';
}

/* ── ۱ سرشماری ──────────────────────────────────────────────────── */
function blockKpis(){
  const done = SEL.filter(s => s.done);
  const times = done.map(s => s._d.ms).filter(Boolean);
  const trust = SEL.map(s => +(s.end || {}).trust).filter(n => n > 0);
  const mi = SEL.filter(s => s._s.money_intent !== undefined);
  const ages = new Set(SEL.map(s => (s.seg || {}).age).filter(Boolean));
  const target = CFG.target || 100;

  const kpi = (v, l, s, c) => '<div class="kpi ' + (c || '') + '"><div class="v num">' + v + '</div>' +
    '<div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';

  return '<div class="sec"><h2>چند نفر</h2><span class="h">' + fa(SEL.length) + ' از هدف ' + fa(target) + '</span><span class="ln"></span></div>' +
    '<div class="kpis">' +
      kpi(fa(SEL.length), 'شروع کرده‌اند', 'هدف: ' + fa(target) + ' نفر') +
      kpi(fa(done.length), 'تا آخر رفته‌اند', fa(pct(done.length, SEL.length)) + '٪ تکمیل', 'gold') +
      kpi(times.length ? TK.mmss(med(times)) : '—', 'زمان میانهٔ کار با اپ', times.length ? 'کمینه ' + TK.mmss(Math.min(...times)) : '') +
      kpi(trust.length ? fa(Math.round(med(trust) * 10) / 10) : '—', 'اعتماد (از ۵)', trust.length ? fa(trust.length) + ' پاسخ' : '', 'ok') +
      kpi(mi.length ? fa(pct(mi.filter(x => x._s.money_intent).length, mi.length)) + '٪' : '—',
          'قصد پول واقعی', mi.length ? fa(mi.length) + ' پاسخ' : '') +
      kpi(fa(ages.size) + '/' + fa(TK.AGES.length), 'پوشش سنی', ages.size < 3 ? 'هنوز یک‌طرفه است' : 'متنوع') +
    '</div>';
}

/* ── ۲ شواهد اصطکاک ─────────────────────────────────────────────
   جای «کجا گیر کردند» بر اساس یک سؤالِ خوداظهاری. آن سؤال حذف شد چون
   جواب‌هایش یک حدسِ آراسته بود: کسی که سه بار روی یک چیزِ غیرِقابل‌کلیک
   زده، ممکن است گیج شده باشد یا بی‌اعتماد یا هیچ‌کدام — و کلیک این را
   نمی‌گوید. اینجا فقط آنچه دیده شده نوشته می‌شود، و هرجا کسی خودش دلیلی
   نگفته باشد، همان «علت گفته نشده» است. */
function blockFriction(){
  const n = SEL.length;
  const act = SEL.map(s => s._d.activeMs).filter(Boolean).sort((a, b) => a - b);
  const p75 = act.length ? act[Math.floor(act.length * .75)] : 0;
  const withRage = SEL.filter(s => s._d.rage > 0).length;
  const withDead = SEL.filter(s => s._d.dead > 0).length;
  const helped = SEL.filter(s => s._d.help).length;
  const said = SEL.filter(s => (s.fb || []).length).length;
  const quiet = n - said;

  const cell = (v, l, sub) => '<div class="kpi"><div class="v num">' + v + '</div><div class="l">' + l + '</div>' +
    (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';

  return '<div class="sec"><h2>شواهد اصطکاک</h2><span class="h">مشاهده، نه علت</span><span class="ln"></span></div>' +
    '<div class="kpis">' +
      cell(act.length ? TK.mmss(med(act)) : '—', 'زمان فعال، میانه', 'بدون زمانی که صفحه پنهان بوده') +
      cell(act.length ? TK.mmss(p75) : '—', 'صدک ۷۵ زمان فعال', '') +
      cell(n ? fa(pct(withRage, n)) + '٪' : '—', 'جلسه با ضربهٔ عصبی', fa(withRage) + ' از ' + fa(n)) +
      cell(n ? fa(pct(withDead, n)) + '٪' : '—', 'جلسه با ضربهٔ بی‌هدف', fa(withDead) + ' از ' + fa(n)) +
      cell(fa(helped), 'کمکِ تسهیل‌گر', helped ? 'این جلسه‌ها «مستقل» نیستند' : 'ثبت نشده') +
      cell(fa(said), 'خودشان چیزی گفتند', quiet ? fa(quiet) + ' نفر: علت گفته نشده' : '') +
    '</div>' +
    '<div class="card"><p class="tiny">می‌شود گفت «بیشترین اصطکاک روی صفحهٔ فلان دیده شد» — جدول پایین همان است. ' +
    'نمی‌شود گفت «مشکل اصلی اعتماد بود»، مگر این‌که کسی خودش گفته باشد.</p></div>';
}

/* ── ۳ سن ───/* ── ۳ سن ───────────────────────────────────────────────────────── */
function blockAges(){
  const max = Math.max(1, ...TK.AGES.map(a => SEL.filter(s => (s.seg || {}).age === a).length));
  const rows = TK.AGES.map(a => {
    const g = SEL.filter(s => (s.seg || {}).age === a);
    if (!g.length) return '<div class="age"><div class="b">' + a + '<small>—</small></div>' +
      '<div><div class="stack"><i style="width:100%;background:rgba(255,255,255,.05)"></i></div>' +
      '<div class="m">کسی از این بازه هنوز نیامده</div></div></div>';
    const tr = g.map(s => +(s.end || {}).trust).filter(n => n > 0);
    const go = { yes: tr.filter(t => t >= 4).length, maybe: tr.filter(t => t === 3).length,
                 no: tr.filter(t => t <= 2).length };
    const gn = tr.length || 1;
    const dn = g.filter(s => s.done).length;
    const w = Math.round(g.length / max * 100);
    return '<div class="age"><div class="b">' + a + '<small class="num">' + fa(g.length) + ' نفر</small></div>' +
      '<div><div class="stack" style="width:' + Math.max(12, w) + '%">' +
        '<i style="width:' + pct(go.yes, gn) + '%;background:var(--ok)"></i>' +
        '<i style="width:' + pct(go.maybe, gn) + '%;background:var(--gold)"></i>' +
        '<i style="width:' + pct(go.no, gn) + '%;background:var(--bad)"></i>' +
      '</div><div class="m">' +
        '<span>تکمیل <b class="num">' + fa(pct(dn, g.length)) + '٪</b></span>' +
        '<span>اعتماد <b class="num">' + (tr.length ? fa(Math.round(med(tr) * 10) / 10) : '—') + '</b></span>' +
        '<span>زمان <b class="num">' + TK.mmss(med(g.map(s => s._d.ms))) + '</b></span>' +
        '<span>گیر <b class="num">' + fa(g.reduce((n, s) => n + s._d.rage + s._d.dead, 0)) + '</b></span>' +
      '</div></div></div>';
  }).join('');

  return '<div class="sec"><h2>سن</h2><span class="h">پهنای میله = تعداد · رنگ = اعتماد</span><span class="ln"></span></div>' +
    '<div class="card"><div class="ages">' + rows + '</div>' +
    '<div class="keys" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--brd)">' +
      '<span><b style="background:var(--ok)"></b>اعتماد ۴ و ۵</span><span><b style="background:var(--gold)"></b>۳</span>' +
      '<span><b style="background:var(--bad)"></b>۱ و ۲</span></div></div>';
}

/* ── ۴ قیف ──────────────────────────────────────────────────────── */
/* ترتیب صفحه‌ها از خودِ مسیرها درمی‌آید، نه از یک نقشهٔ دستی: میانهٔ
   «چندمین صفحه‌ای که دیدند» ترتیب را می‌سازد، پس نسخهٔ بعدی هم بدون
   دست‌کاری این صفحه درست نمایش داده می‌شود. */
function blockFunnel(){
  const first = {};
  SEL.forEach(s => { const seen = {};
    s._d.path.forEach((scr, i) => { if (seen[scr]) return; seen[scr] = 1;
      (first[scr] = first[scr] || []).push(i); }); });
  const list = Object.keys(first)
    .map(k => ({ k, n: first[k].length, at: med(first[k]) }))
    .filter(x => x.n >= Math.max(2, Math.ceil(SEL.length * .08)))
    .sort((a, b) => a.at - b.at).slice(0, 14);

  if (!list.length) return '';
  const top = list[0].n;
  let out = '';
  list.forEach((x, i) => {
    if (i) {
      const d = list[i - 1].n - x.n;
      out += '<div class="drop' + (d <= 0 ? ' ok' : '') + '">' +
        (d > 0 ? '↓ ' + fa(d) + ' نفر اینجا ادامه ندادند (' + fa(pct(d, list[i - 1].n)) + '٪)' : '↓ کسی از دست نرفت') + '</div>';
    }
    out += '<div class="s"><div class="fill" style="width:' + pct(x.n, top) + '%"></div>' +
      '<div class="nm">' + esc(TK.screenFa(x.k)) + '<small class="en">' + esc(x.k) + '</small></div>' +
      '<div class="n num">' + fa(x.n) + ' نفر · ' + fa(pct(x.n, SEL.length)) + '٪</div></div>';
  });
  return '<div class="sec"><h2>مسیر</h2><span class="h">به ترتیبی که واقعاً دیده شده</span><span class="ln"></span></div>' +
    '<div class="card"><div class="fun">' + out + '</div></div>';
}

/* ── ۵ نقشهٔ ضربه ───────────────────────────────────────────────── */
/* همان پروتوتایپ، زنده، با ضربه‌های واقعی روی آن. چون هر دو صفحه روی یک
   مبدأ هستند، می‌شود صفحهٔ دلخواه را در iframe باز کرد و دقیقاً همان
   چیزی را نشان داد که شرکت‌کننده دیده است. */
function screenStats(){
  const st = {};
  SEL.forEach(s => {
    const d = s._d;
    Object.keys(d.time).forEach(k => {
      st[k] = st[k] || { k, n: 0, ms: [], taps: [], rage: [], dead: [], exit: 0 };
      st[k].n++; st[k].ms.push(d.time[k]);
    });
    d.taps.forEach(t => { if (!st[t.s]) return; st[t.s].taps.push(t); });
    d.rages.forEach(t => { if (!st[t.s]) return; st[t.s].rage.push(t); });
    d.deads.forEach(t => { if (!st[t.s]) return; st[t.s].dead.push(t); });
    if (d.deepest && st[d.deepest]) st[d.deepest].exit++;
  });
  return Object.values(st).sort((a, b) => b.n - a.n);
}

function blockHeat(){
  const st = screenStats();
  if (!st.length) return '';
  if (!heatScreen || !st.find(x => x.k === heatScreen)) heatScreen = st[0].k;
  const v = $('f-ver').value;
  const file = (VERS.find(x => x.id === v) || {}).file || ('wallet-v' + v + '.html');

  return '<div class="sec"><h2>کجا را زدند</h2><span class="h">ضربه‌های واقعی، روی خودِ همان صفحه</span><span class="ln"></span></div>' +
    '<div class="card"><div class="heat">' +
      '<div class="dev" id="dev">' +
        '<iframe id="heat-frame" src="./' + esc(file) + '?heat=1" title="پیش‌نمایش"></iframe>' +
        '<canvas id="heat-canvas" width="390" height="844"></canvas>' +
        '<div id="heat-marks"></div>' +
      '</div>' +
      '<div class="side">' +
        '<p class="tiny" style="margin-bottom:12px">یک صفحه را انتخاب کنید. لکه‌های روشن‌تر یعنی ضربهٔ بیشتر؛ ' +
        'حلقهٔ قرمز یعنی سه ضربهٔ پشت‌هم روی یک نقطه (عصبانیت)، و دایرهٔ نقطه‌چین یعنی ضربه روی چیزی که اصلاً دکمه نبوده.</p>' +
        '<div class="screens">' + st.map(x =>
          '<button class="srow" aria-pressed="' + (x.k === heatScreen) + '" data-k="' + esc(x.k) + '" onclick="pickScreen(this)">' +
            '<div class="n">' + esc(TK.screenFa(x.k)) + '<small class="en">' + esc(x.k) + '</small></div>' +
            '<div class="v num">' + fa(x.n) + ' نفر</div>' +
            '<div class="w num">' + ((x.rage.length + x.dead.length) ? fa(x.rage.length + x.dead.length) + ' گیر' : '') + '</div>' +
          '</button>').join('') + '</div>' +
      '</div>' +
    '</div></div>';
}
function pickScreen(b){
  heatScreen = b.dataset.k;
  TK.$$('.srow').forEach(r => r.setAttribute('aria-pressed', r.dataset.k === heatScreen));
  paintHeat();
}
function paintHeat(){
  const f = $('heat-frame'); if (!f) return;
  const st = screenStats().find(x => x.k === heatScreen); if (!st) return;
  const go = () => {
    try {
      const w = f.contentWindow;
      if (w.seed) { try { w.seed(); } catch (e) {} }
      if (w.go) w.go(heatScreen);
      const d = f.contentDocument;
      const s = d.createElement('style');
      s.textContent = '#dev-fab,#chrome,.hint{display:none!important}';
      d.head.appendChild(s);
    } catch (e) {}
  };
  if (f.dataset.ready) go(); else f.onload = () => { f.dataset.ready = '1'; setTimeout(go, 260); };

  /* چگالی خاکستری جمع می‌شود، بعد به رنگ نگاشته می‌شود — همان کاری که
     یک heatmap واقعی می‌کند، بدون هیچ کتابخانه‌ای. */
  const c = $('heat-canvas'), x = c.getContext('2d', { willReadFrequently: true });
  x.clearRect(0, 0, 390, 844);
  if (st.taps.length) {
    x.globalCompositeOperation = 'lighter';
    st.taps.forEach(t => {
      const px = t.x / 1000 * 390, py = t.y / 1000 * 844;
      const g = x.createRadialGradient(px, py, 0, px, py, 40);
      g.addColorStop(0, 'rgba(255,255,255,.3)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = g; x.beginPath(); x.arc(px, py, 40, 0, 6.2832); x.fill();
    });
    x.globalCompositeOperation = 'source-over';
    const im = x.getImageData(0, 0, 390, 844), p = im.data;
    for (let i = 0; i < p.length; i += 4) {
      const a = p[i + 3] / 255; if (!a) continue;
      const v = Math.min(1, a * 1.5);
      p[i]     = 255;
      p[i + 1] = Math.round(220 - 150 * v);
      p[i + 2] = Math.round(150 - 130 * v);
      p[i + 3] = Math.round(Math.min(.82, v * 1.15) * 255);
    }
    x.putImageData(im, 0, 0);
  }
  $('heat-marks').innerHTML =
    st.rage.map(t => '<i class="mk rage" style="left:' + (t.x / 10) + '%;top:' + (t.y / 10) + '%"></i>').join('') +
    st.dead.map(t => '<i class="mk dead" style="left:' + (t.x / 10) + '%;top:' + (t.y / 10) + '%"></i>').join('');
}

/* ════════ داشبورد فرضیه‌ها ══════════════════════════════════════
   Gateها عیناً از §۳۲ سند. هیچ میانگینی جای یک Gateِ افتاده را نمی‌گیرد:
   وضعیت هر کارت از بدترین شاخصش می‌آید، نه از میانگینشان. */
const GATES = {
  /* مأموریت اصلی — رفتاری */
  completion:.80, independent:.70, direct:.70,
  /* ارزش و جایگاه — پاسخ مستقیم */
  positioning:.80, distinct:.60, no_distinct_max:.40,
  /* قابلیت‌ها */
  top_feature:.35,
  /* فهم و اعتماد */
  asset:.70, custody:.70, control_route:.70,
  trust_45:.70, trust_median:4, trust_12_max:.15, misconception_max:.20,
  /* قصد */
  practical:.60, money:.40, no_action_max:.30
};
const SAMPLE = { none:10, directional:10, provisional:20, decision:30, target:100 };
let VIEW = 'ux';

function setView(v){
  VIEW = v;
  TK.$$('#tabs .tb').forEach((b,i)=>b.setAttribute('aria-pressed', String((i===0)===(v==='ux'))));
  render();

const rate = (n, d) => d ? n / d : 0;
const pctTxt = v => fa(Math.round(v * 100)) + '٪';
const SRCB = { beh:['رفتاری','b'], ans:['پاسخ مستقیم','a'], act:['اقدام واقعی','c'] };

/* ── یک ردیف شاخص ───────────────────────────────────────────────────
   مخرجِ خودش، منبعِ خودش. مخرجِ صفر «—» است و نه «۰٪»: نبودِ پاسخ، پاسخِ
   منفی نیست. شاخصِ تشخیصی کارت را رد یا تأیید نمی‌کند. */
function kpi(name, num, den, gate, o){
  o = o || {};
  const f = o.fmt || pctTxt, dir = o.dir || 'min';
  const has = den > 0;
  const value = !has ? null : (o.raw ? num : num / den);
  const pass = !has ? null : (dir === 'max' ? value <= gate : value >= gate);
  const near = (has && !pass) && Math.abs(value - gate) <= (o.slack !== undefined ? o.slack : (gate > 1 ? .5 : .10));
  const st = o.off ? ['none','پرسیده نشد']
    : !has ? ['none','—'] : pass ? ['ok','رسیده'] : near ? ['near','نزدیک'] : ['bad','نرسیده'];
  const src = SRCB[o.src || 'ans'];
  /* شاخصی که سؤالش پرسیده نمی‌شود، نه Gate است و نه «در انتظار داده» */
  return { name, value, den, pass, near, gate, diag: !!o.diag || !!o.off, off: !!o.off,
    html:'<div class="kpirow' + (o.diag ? ' diag' : '') + '"><span class="n">' + name +
      '<span class="src ' + src[1] + '">' + src[0] + '</span></span>' +
      '<span class="v num">' + (has ? f(value) : '—') + '</span>' +
      '<span class="g num">' + (dir === 'max' ? '≤ ' : '≥ ') + f(gate) + '</span>' +
      '<span class="nn num">n=' + fa(den) + '</span>' +
      '<span class="st ' + st[0] + '">' + st[1] + '</span></div>' };
}

/* وضعیت کارت از بدترین شاخصِ Gate می‌آید، نه از میانگینشان — و تا وقتی
   هیچ شاخصی به بیست پاسخ نرسیده، کارت قضاوت نمی‌کند. */
function hstatus(rows){
  const g = rows.filter(r => !r.diag && r.den > 0);
  const ready = g.filter(r => r.den >= SAMPLE.provisional);
  if (!g.length) return ['none', rows.some(r => r.off)
    ? 'سؤال این کارت در این راند پرسیده نمی‌شود — فقط شواهد رفتاری'
    : 'هنوز پاسخی برای این کارت نیست'];
  if (!ready.length) return ['none','شواهد کافی نیست · بیشترین n=' + fa(Math.max(...g.map(r => r.den)))];
  if (ready.every(r => r.pass)) return ['ok', ready.every(r => r.den >= SAMPLE.decision) ? 'تأیید شد' : 'تأیید مقدماتی'];
  if (ready.every(r => r.pass || r.near)) return ['near','نیاز به اصلاح'];
  return ['bad','تأیید نشد'];
}
function hcard(code, title, claim, srcKind, rows, extra){
  const st = hstatus(rows);
  const src = srcKind === 'mix' ? ['ترکیبی','c'] : SRCB[srcKind];
  const lead = rows.find(r => !r.diag && r.den > 0);
  return '<div class="hcard"><div class="hh"><span class="code">' + code + '</span><h3>' + title + '</h3>' +
      '<span class="src ' + src[1] + '">' + src[0] + '</span></div>' +
    '<div class="hl num">' + (lead && lead.value !== null ? pctTxt(lead.value) : '—') + '</div>' +
    '<div class="hs">' + claim + '</div>' +
    rows.map(r => r.html).join('') +

}

/* ── نوار کیفیت داده ───────────────────────────────────────────────
   قبل از هر عددی، این: چند نفر آمدند و هر کدام تا کجا رفتند. بدون این،

function dqBar(){
  const n = SEL.length;

  const cell = (l, v, warn) => '<span' + (warn ? ' class="warn"' : '') + '><b class="num">' + fa(v) + '</b>' + l + '</span>';
  return '<div class="dq">' +
    cell('جلسهٔ یکتا', n) +
    cell('مأموریت را شروع کرد', started) +
    cell('به سؤال‌ها رسید', battery) +
    cell('کامل', dn) +
    cell('ناتمام', n - dn, n - dn > dn) +
    cell('تحویلِ تأییدشده', conf) +
    (help ? cell('با کمکِ تسهیل‌گر', help) : '') +
    '</div>' +
    (MIXED ? '<div class="qual" style="border-color:rgba(224,108,91,.4)"><svg viewBox="0 0 24 24" style="width:17px;height:17px;flex:none;margin-top:3px;stroke:var(--bad);fill:none;stroke-width:1.8"><path d="M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><p><b>دو پروتکل با هم نمایش داده می‌شوند.</b> تعریفِ چند شاخص بین ۱.۰ و ۱.۱ عوض شده است؛ این عددها با هم جمع‌شدنی نیستند. برای تصمیم، از فیلترِ پروتکل یکی را انتخاب کنید.</p></div>' : '');
}

/* ── کارت‌های فرضیه ───────────────────────────────────────────────── */
function hypoView(){
  const all = SEL;
  /* مخرج‌های رسمی: هر کدام جدا، و هیچ‌کدام «همهٔ جلسه‌ها» نیست. */
  const startedS = all.filter(s => s._d.path.length > 0);          /* مأموریت را شروع کرد */
  const ans = (k) => all.filter(s => (s.end || {})[k] !== undefined && (s.end || {})[k] !== '' &&
    !(Array.isArray((s.end || {})[k]) && !(s.end || {})[k].length));
  const scored = (k) => all.filter(s => s._s[k] !== undefined);
  const dn = all.filter(s => s.done);

  if (!startedS.length && !dn.length) return dqBar() +
    '<div class="card empty"><h3>هنوز جلسه‌ای نیست</h3>' +
    '<p class="tiny">لینک این راند را از کنسول بردارید و بفرستید.</p></div>';

  const cnt = (list, f) => list.filter(f).length;
  /* سؤالی که در نسخهٔ جاری پرسیده نمی‌شود: مخرجش هیچ‌وقت پر نمی‌شود، و
     کارت باید همین را بگوید نه «منتظر داده». */
  const off = k => TK.CORE_Q.indexOf(k) < 0;

  /* ── H1 مسیر اصلی — فقط رفتاری ───────────────────────────────── */
  const nS = startedS.length;
  const act = startedS.map(s => s._b.activeMs).filter(Boolean).sort((a,b)=>a-b);
  const h1 = [
    kpi('تکمیل مأموریت', cnt(startedS, s=>s._b.completed), nS, GATES.completion, {src:'beh'}),
    kpi('تکمیل مستقل', cnt(startedS, s=>s._b.independent), nS, GATES.independent, {src:'beh'}),
    kpi('مسیر مستقیم', cnt(startedS, s=>s._b.direct), nS, GATES.direct, {src:'beh'}),
    kpi('زمان فعالِ میانه', act.length?med(act)/60000:0, act.length, 3,
        {src:'beh', dir:'max', raw:true, diag:true, slack:.5, fmt:v=>fa(Math.round(v*10)/10)+'د'}),
    kpi('صدک ۷۵ زمان فعال', act.length?act[Math.floor(act.length*.75)]/60000:0, act.length, 5,
        {src:'beh', dir:'max', raw:true, diag:true, slack:.5, fmt:v=>fa(Math.round(v*10)/10)+'د'}),
    kpi('جلسه با ضربهٔ عصبی', cnt(startedS, s=>s._d.rage>0), nS, .20, {src:'beh', dir:'max', diag:true})
  ];

  /* ── H2 ارزش و جایگاه ────────────────────────────────────────── */
  const q1 = ans('positioning_main'), q2 = ans('distinct_value');
  const h2 = [
    kpi('تشخیص درست جایگاه', cnt(q1, s=>s._s.positioning_correct), q1.length, GATES.positioning),
    kpi('تشخیص ارزش متمایز', cnt(q2, s=>s._s.distinct_value_recognized), q2.length, GATES.distinct, {off:off('distinct_value')}),
    kpi('«تفاوتی نمی‌بینم»', cnt(q2, s=>s._s.no_distinct_value), q2.length, GATES.no_distinct_max, {dir:'max', off:off('distinct_value')})
  ];

  /* ── H3 قابلیت‌ها ────────────────────────────────────────────── */
  const q5 = ans('feature_top2');
  const top2 = tallyAll(q5.map(s=>s.end.feature_top2));
  const topKey = Object.keys(top2).sort((a,b)=>top2[b]-top2[a])[0];
  const firstR = tally(startedS.map(s=>s._b.first_route));
  const doneR = tallyAll(startedS.map(s=>s._b.routes_completed));
  const h3 = [
    kpi('سهم قابلیتِ اول در Top-2' + (topKey?' — '+esc(L.feat[topKey]||topKey):''),
        topKey?top2[topKey]:0, q5.length, GATES.top_feature, {off:off('feature_top2')}),
    /* سؤالِ قابلیت‌ها که حذف شد، شاهدِ این فرضیه تماماً رفتاری است —
       پس همان می‌شود Gate، نه یک شاخصِ تشخیصیِ کنار آن. */
    kpi('مسیری را در اپ تا آخر برد', cnt(startedS, s=>s._b.routes_completed.length>0), nS, .50,
        {src:'beh', diag:!off('feature_top2')})
  ];

  /* ── H4 فهم و اعتماد ─────────────────────────────────────────── */
  const q3 = ans('asset_understanding'), q4 = ans('custody_understanding'), q6 = ans('trust');
  const trusts = q6.map(s=>+s.end.trust).filter(v=>v>0).sort((a,b)=>a-b);
  const misAll = tallyAll(all.map(s=>s._s.misconceptions));
  const misDen = Math.max(q3.length, q4.length);
  const worstMis = Object.keys(misAll).reduce((a,k)=>Math.max(a, rate(misAll[k], misDen)), 0);
  const h4 = [
    kpi('فهم ماهیت دارایی', cnt(q3, s=>s._s.asset_correct), q3.length, GATES.asset, {off:off('asset_understanding')}),
    kpi('فهم جای نگهداری', cnt(q4, s=>s._s.custody_correct), q4.length, GATES.custody),
    kpi('اعتماد ۴ یا ۵', cnt(q6, s=>s._s.trust_high), q6.length, GATES.trust_45),
    kpi('میانهٔ اعتماد', trusts.length?med(trusts):0, trusts.length, GATES.trust_median,
        {raw:true, slack:.5, fmt:v=>fa(Math.round(v*10)/10)}),
    kpi('اعتماد ۱ یا ۲', cnt(q6, s=>s._s.trust_low), q6.length, GATES.trust_12_max, {dir:'max'}),
    kpi('بدترین کج‌فهمی', worstMis, misDen, GATES.misconception_max, {raw:true, dir:'max'}),
    /* مأموریتِ خروج حذف شد؛ این رفتار آزاد است، پس شاهدِ تشخیصی است نه Gate */
    kpi('راهی برای بیرون‌آوردن پول پیدا کرد', cnt(startedS, s=>s._b.control_route), nS,
        GATES.control_route, {src:'beh', diag:true})
  ];

  /* ── H5 قصد ──────────────────────────────────────────────────── */
  const q7 = ans('commitment_step');
  const cta = dn.filter(s => s.delivery_confirmed);          /* CTA فقط بعد از ثبت دیده می‌شود */
  const acts = tallyAll(cta.map(s=>s.post_actions));
  const h5 = [
    kpi('اقدام عملی', cnt(q7, s=>s._s.practical_action), q7.length, GATES.practical),
    kpi('قصد پول واقعی', cnt(q7, s=>s._s.money_intent), q7.length, GATES.money),
    kpi('هیچ اقدامی', cnt(q7, s=>s._s.no_action), q7.length, GATES.no_action_max, {dir:'max'}),
    kpi('مبلغ جدی', cnt(q7, s=>s._s.high_intent), q7.length, .20, {diag:true}),
    kpi('روی یکی از پیشنهادهای پایان زد', cnt(cta, s=>(s.post_actions||[]).length>0), cta.length, .30,
        {src:'act', diag:true}),
    kpi('خودش شماره گذاشت', cnt(cta, s=>s.contact && (s.contact.tel||s.contact.name)), cta.length, .15,
        {src:'act', diag:true})
  ];

  /* ── خلاصهٔ تصمیم: پنج عدد، هر کدام با مخرج و منبعِ خودش ─────── */
  const bothCorrect = all.filter(s => s._s.asset_correct !== undefined && s._s.custody_correct !== undefined);
  const five = [
    ['تکمیل مأموریت اصلی', h1[0], 'beh'],
    ['تشخیص درست جایگاه', h2[0], 'ans'],
    [off('asset_understanding') ? 'فهم جای نگهداری' : 'فهم ماهیت و نگهداری',
      off('asset_understanding')
        ? kpi('', cnt(q4, s=>s._s.custody_correct), q4.length, GATES.custody)
        : kpi('', cnt(bothCorrect, s=>s._s.asset_correct && s._s.custody_correct), bothCorrect.length, .70), 'ans'],
    ['اعتماد ۴ و ۵', h4[2], 'ans'],
    ['قصد پول واقعی', h5[1], 'ans']
  ];
  const svc = (r) => r.den === 0 ? '' : r.pass ? 'ok' : r.near ? 'near' : 'bad';

  const allGate = [].concat(h1,h2,h3,h4,h5).filter(r=>!r.diag && r.den>=SAMPLE.provisional);
  const failed = allGate.filter(r=>!r.pass && !r.near).length;
  const maxN = Math.max(0, ...[].concat(h1,h2,h3,h4,h5).map(r=>r.den));
  const lic = maxN < SAMPLE.none ? 'زیر ۱۰ پاسخ، هیچ قضاوتی مجاز نیست'
    : maxN < SAMPLE.provisional ? 'جهت‌دهنده است، نه تصمیم‌ساز'
    : maxN < SAMPLE.decision ? 'مقدماتی؛ برای تصمیم نهایی کافی نیست'
    : 'برای تصمیمِ این راند کافی است';

  /* ── گفته در برابر رفتار ─────────────────────────────────────── */
  const saidDid = '<div class="sec"><h2>گفته در برابر رفتار</h2><span class="h">دو framing متفاوت</span><span class="ln"></span></div>' +
    '<div class="card"><table><tr><th>قابلیت</th><th>Top-2 در پرسش ۵</th><th>اولین مسیر در اپ</th><th>تا آخر برد</th></tr>' +
    Object.keys(L.route).map(k =>
      '<tr><td><b>' + esc(L.feat[k] || L.route[k]) + '</b></td>' +
      '<td class="num">' + (q5.length ? fa(top2[k]||0) + ' · ' + fa(pct(top2[k]||0, q5.length)) + '٪' : '—') + '</td>' +
      '<td class="num">' + (nS ? fa(firstR[k]||0) + ' · ' + fa(pct(firstR[k]||0, nS)) + '٪' : '—') + '</td>' +
      '<td class="num">' + (nS ? fa(doneR[k]||0) : '—') + '</td></tr>').join('') +
    '</table><p class="tiny" style="margin-top:12px">در پرسش ۵ هر نفر <b>دو</b> انتخاب دارد، پس جمعِ آن ستون تا ۲۰۰٪ می‌رسد. ' +
    'ستون‌های مسیر از رفتارِ همان یک نشست می‌آیند و مأموریت، رفتار را محدود کرده بود: ' +
    'ناهم‌خوانیِ این دو ستون «تناقض» نیست.</p></div>';

  return dqBar() +
    '<div class="qual"><svg viewBox="0 0 24 24" style="width:17px;height:17px;flex:none;margin-top:3px;stroke:var(--gold);fill:none;stroke-width:1.8"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>' +
      '<p><b>' + fa(dn.length) + ' جلسهٔ کامل</b> از ' + fa(all.length) + ' جلسه · ' + lic +
      '. هدف این راند ' + fa(CFG.target||100) + ' نفر است. هر شاخص مخرجِ خودش را دارد؛ ' +
      'کسی که سؤالی را ندیده، در آن شاخص شمرده نمی‌شود.</p></div>' +

    '<div class="sec"><h2>خلاصهٔ تصمیم</h2><span class="h">' +
      (allGate.length ? (failed ? fa(failed) + ' شاخص از Gate عقب است' : 'همهٔ شاخص‌های واجد، روی Gate یا نزدیک آن')
                      : 'هنوز هیچ شاخصی به ۲۰ پاسخ نرسیده') +
      '</span><span class="ln"></span></div>' +
    '<div class="sv">' + five.map(([l, r, src]) =>
      '<div class="c ' + svc(r) + '"><div class="v num">' + (r.den ? pctTxt(r.value) : '—') + '</div>' +
      '<div class="l">' + l + '</div><div class="m"><span class="num">n=' + fa(r.den) + '</span>' +
      '<span class="num">Gate ≥ ' + pctTxt(r.gate) + '</span>' +
      '<span class="src ' + SRCB[src][1] + '">' + SRCB[src][0] + '</span></div></div>').join('') + '</div>' +

    '<div class="sec"><h2>فرضیه‌ها</h2><span class="h">ترتیب تفسیر: ارزش → فهم → اعتماد → اقدام</span><span class="ln"></span></div>' +
    hcard('H2','ارزش و جایگاه','مهاجر را «حفظ ارزش همراه با کنترل، استفاده و خروج» می‌فهمد و حداقل یک تمایز واقعی نسبت به صرافی می‌بیند.','ans', h2,
      distBlock('مهم‌ترین کاری که مهاجر می‌کند', tally(q1.map(s=>s.end.positioning_main)), q1.length, L.positioning) +
      distBlock('ارزشِ اضافه نسبت به خرید مستقیم تتر (دو انتخاب)', tallyAll(q2.map(s=>s.end.distinct_value)), q2.length, L.feat)) +
    hcard('H4','فهم و اعتماد','می‌داند دارایی‌اش چیست و کجا می‌ماند، و اعتماد قابل قبولی دارد.','mix', h4,
      distBlock('بعد از تبدیل، چه چیزی نگه داشته می‌شود', tally(q3.map(s=>s.end.asset_understanding)), q3.length, L.asset) +
      distBlock('پول کجا می‌ماند', tally(q4.map(s=>s.end.custody_understanding)), q4.length, L.custody) +
      distBlock('کج‌فهمی‌های بحرانی', misAll, misDen, L.mis)) +
    hcard('H1','مسیر اصلی تأمین مالی','کاربر بدون کمک، تبدیل را تا آخر انجام می‌دهد.','beh', h1,
      distBlock('اولین مسیری که بعد از تبدیل باز کرد', firstR, nS, L.route)) +
    hcard('H3','اعتبار قابلیت‌ها','بین قابلیت‌ها اولویتی روشن شکل می‌گیرد و رفتار دست‌کم بخشی از آن را تأیید می‌کند.','mix', h3,
      distBlock('دو قابلیتِ ضروری (هر نفر دو انتخاب)', top2, q5.length, L.feat) +
      distBlock('مسیرهایی که تا آخر رفته‌اند', doneR, nS, L.route)) +
    hcard('H5','قصد رفتاری','قدم بعدی‌اش از موافقتِ کلی فراتر می‌رود.','mix', h5,
      distBlock('محتمل‌ترین قدم بعدی', tally(q7.map(s=>s.end.commitment_step)), q7.length, L.step) +
      distBlock('اقدام‌های بعد از پایان', acts, cta.length, L.act)) +
    saidDid;
}

/* ── بیرون بردن ─────────────────────────────────────────────────── */
function exportCsv(){
  const meta = {
    generated_at: new Date().toISOString(), product_version: $('f-ver').value,
    round: $('f-round').value || 'all', protocol_version: $('f-proto').value || 'all',
    scoring_version: TK.SCORING_VERSION, question_set: TK.QUESTION_SET,
    sources: (SRC && SRC.status || []).map(x => (x.ok ? 'ok:' + x.n : 'down')).join('+') || 'local'
  };
  const rows = SEL.map(s => {
    const d = s._d, e = s.end || {}, g = s.seg || {}, b = s._b, sc = s._s;
    return Object.assign({}, meta, {
      id: s.id, round: s.r, channel: TK.CHANNELS[s.c] || s.c, protocol: TK.protoOf(s),
      started: s.t0, completed: s.done ? 1 : 0, confirmed: s.delivery_confirmed ? 1 : 0,
      revision: s.revision || 0, answered_of_7: sc.answered || 0,
      seconds: Math.round(d.ms / 1000), active_seconds: Math.round(d.activeMs / 1000),
      age: g.age || '', fx: g.fx || '', crypto: g.crypto || '', savings: g.where || '',
      mission_completed: b.completed ? 1 : 0, mission_independent: b.independent ? 1 : 0,
      mission_direct: b.direct ? 1 : 0, facilitator_help: b.help ? 1 : 0,
      first_route: b.first_route || '', routes: (b.routes || []).join('+'),
      routes_completed: (b.routes_completed || []).join('+'), control_route: b.control_route ? 1 : 0,
      positioning: e.positioning_main || '', distinct_value: [].concat(e.distinct_value || []).join('+'),
      asset: e.asset_understanding || '', custody: e.custody_understanding || '',
      feature_top2: [].concat(e.feature_top2 || []).join('+'),
      trust: e.trust || '', next_step: e.commitment_step || '',
      positioning_correct: sc.positioning_correct, asset_correct: sc.asset_correct,
      custody_correct: sc.custody_correct, money_intent: sc.money_intent,
      misconceptions: (sc.misconceptions || []).join('+'),
      post_actions: (s.post_actions || []).join('+'),
      screens: d.screens, taps: d.taps.length, rage: d.rage, dead: d.dead,
      deepest: d.deepest, path: d.path.join(' > '),
      feedback: (s.fb || []).map(f => (f.mood || '') + ':' + (f.text || '')).join(' | ')
    });
  });
  TK.download('mohajer-sessions-v' + $('f-ver').value + '.csv', TK.csv(rows), 'text/csv');
}
/* جدا، عمداً: این فایل اطلاعات شخصی دارد و نباید با فایلی که دست‌به‌دست
   می‌شود یکی باشد. */
function exportContacts(){
  const rows = SEL.filter(s => s.contact && ((s.contact.name||'').trim() || (s.contact.tel||'').trim()))
    .map(s => ({ name: (s.contact.name||'').trim(), tel: (s.contact.tel||'').trim(),
      age: (s.seg||{}).age || '', round: s.r, protocol: TK.protoOf(s),
      asked: (s.post_actions||[]).join('+'), at: s.t0, id: s.id }));
  if (!rows.length) return alert('هنوز کسی شماره نگذاشته است.');
  TK.download('mohajer-contacts-v' + $('f-ver').value + '.csv', TK.csv(rows), 'text/csv');
}
function exportJson(){
  TK.download('mohajer-test-v' + $('f-ver').value + '.json',
    JSON.stringify(SEL.map(s => { const c = { ...s }; delete c._d; return c; }), null, 1));
}
